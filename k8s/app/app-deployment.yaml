apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: session-app

  template:
    metadata:
      labels:
        app: session-app

    spec:
      containers:
        - name: session-app
          image: session-app:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 8080

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5

          env:
            - name: REDIS_HOST
              value: redis