apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: session-app

  template:
    metadata:
      labels:
        app: session-app

    spec:
      containers:
        - name: session-app
          image: session-app:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 8080

          env:
            - name: REDIS_HOST
              value: redis-service